name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'
  NODE_OPTIONS: '--no-deprecation'

jobs:
  build-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment (Active LTS Node 22)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'package.json'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build React/Vite Web App
        run: npm run build

      - name: Add & Sync Capacitor Android Project
        run: |
          if [ ! -d "android" ]; then
            echo "Adding Capacitor Android platform..."
            npx cap add android
          fi
          echo "Syncing Capacitor Android platform..."
          npx cap sync android

      - name: Configure Storage Permissions for Documents/TAHON
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            if ! grep -q "WRITE_EXTERNAL_STORAGE" "$MANIFEST"; then
              sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" \/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="32" \/>' "$MANIFEST"
              echo "Added READ/WRITE_EXTERNAL_STORAGE permissions to AndroidManifest.xml"
            fi
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          build-root-directory: android
          cache-disabled: true

      - name: Make Gradlew Executable
        run: |
          if [ -f "android/gradlew" ]; then
            chmod +x android/gradlew
          fi

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact (With Quota Protection)
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: mill-management-app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 1

      - name: Publish APK to GitHub Release (Bypasses Artifact Quota)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        continue-on-error: true
        with:
          tag_name: latest-apk-build
          name: Mill Management System - Latest Android APK Build
          body: |
            ### 🌾 نظام إدارة محل الطاحونة - نسخة أندرويد APK المحدثة
            - تاريخ البناء: ${{ github.event.head_commit.timestamp || 'Latest' }}
            - الالتزام: ${{ github.sha }}
            - تم البناء بواسطة GitHub Actions بنجاح.
          draft: false
          prerelease: false
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
